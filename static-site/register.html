<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHUB | Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
<header class="site-header">
  <nav class="navbar container">
    <a href="index.html" class="brand">StudyHUB<span>Portal</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li data-auth="user"><a href="dashboard.html">Dashboard</a></li>
      <li data-auth="guest"><a href="login.html">Login</a></li>
      <li data-auth="guest"><a href="register.html" class="btn btn-small">Register</a></li>
      <li data-auth="user"><button type="button" class="btn btn-small btn-outline" data-logout>Logout</button></li>
    </ul>
  </nav>
</header>
<main class="form-page">
  <section class="form-card wide">
    <h1>Create Your Account</h1>
    <p class="sub">Fill in your student details to get started.</p>
    <form id="registerForm" novalidate>
      <div class="alert" hidden></div>
      <div class="form-row">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" autocomplete="name">
          <small class="field-msg"></small>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
          <small class="field-msg"></small>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" autocomplete="tel">
          <small class="field-msg"></small>
        </div>
        <div class="form-group">
          <label for="department">Department</label>
          <select id="department" name="department">
            <option value="">Select department</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Electronics</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>Business</option>
          </select>
          <small class="field-msg"></small>
        </div>
      </div>
      <div class="form-group">
        <label for="year">Year of Study</label>
        <select id="year" name="year">
          <option value="">Select year</option>
          <option>1st Year</option>
          <option>2nd Year</option>
          <option>3rd Year</option>
          <option>4th Year</option>
        </select>
        <small class="field-msg"></small>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min 8 chars, letters and numbers" autocomplete="new-password">
          <small class="field-msg"></small>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
          <small class="field-msg"></small>
        </div>
      </div>
      <button type="submit" class="btn btn-block">Register</button>
    </form>
    <p class="form-footer">Already registered? <a href="login.html">Login here</a></p>
  </section>
</main>
<footer class="site-footer">
  <div class="container">
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>
    <p>&copy; 2026 StudyHUB. All rights reserved.</p>
  </div>
</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
